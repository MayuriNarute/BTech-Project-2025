<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Arial', sans-serif;
        }
        .navbar {
            background-color: #0056b3 !important;
            padding: 15px;
        }
        .navbar-brand, .navbar-nav .nav-link {
            color: #ffffff !important;
            font-weight: 500;
        }
        .navbar-nav .nav-link:hover {
            color: #ffcc00 !important;
        }
        .main-container {
            max-width: 600px;
            margin: 50px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            color: #0056b3;
            font-weight: bold;
        }
        .btn-custom {
            width: 100%;
            height: 50px;
            font-size: 18px;
            background-color: #0056b3;
            border: none;
            color: white;
            transition: all 0.3s ease-in-out;
            margin-top: 15px;
        }
        .btn-custom:hover {
            background-color: #003d80;
            transform: scale(1.05);
        }
        footer {
            background-color: #343a40;
            color: white;
            padding: 20px;
            margin-top: 50px;
            text-align: center;
            font-size: 14px;
        }
        #drop-area {
            border: 2px dashed #0056b3;
            padding: 20px;
            margin-top: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Blood Cancer Detection</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/login">Login</a></li>
                    <li class="nav-item"><a class="nav-link" href="/signup">Sign Up</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/upload_report">Upload Image</a></li>
                    <li class="nav-item"><a class="nav-link" href="/analysis">Analysis</a></li>
                    <li class="nav-item"><a class="nav-link" href="/aboutus">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li>
                    <li class="nav-item"><a class="nav-link" href="/logout">Logout</a></li>
                </ul>
                <form class="d-flex">
                    <input class="form-control me-2" type="search" placeholder="Search">
                </form>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="main-container">
            <h1>Upload Report</h1>
            <form id="uploadForm" method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div id="drop-area">
                    <p>Drag & Drop an image or click to select</p>
                    <input type="file" id="image" name="report" accept="image/*" required>
                </div>
                <img id="imagePreview" src="#" alt="Image Preview" style="display: none; max-width: 100%; margin-top: 10px;">
                <button type="submit" class="btn btn-custom">Upload</button>
            </form>
            <a href="{% url 'main_page' %}" class="btn btn-danger btn-custom">Back to Main Page</a>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Blood Cancer Detection Platform. All rights reserved.</p>
    </footer>
    <script>
        function previewImage(event) {
            var reader = new FileReader();
            reader.onload = function() {
                var preview = document.getElementById('imagePreview');
                preview.src = reader.result;
                preview.style.display = 'block';
            }
            reader.readAsDataURL(event.target.files[0]);
        }
        document.getElementById("image").addEventListener("change", previewImage);
    </script>
</body>
</html>
